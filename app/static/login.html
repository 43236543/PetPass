
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — PetPass</title>
    <link rel="stylesheet" href="/static/css/login.css">
    <script src="/static/js/login.js" defer></script>
</head>
<body>
    <main class="login-page">

        <header class="login-header">
            <div class="logo">🐾 PetPass</div>
            <h1>С ВОЗВРАЩЕНИЕМ!</h1>
            <p>Авторизируйтесь, чтобы воспользоваться нашими услугами</p>
        </header>

        <section class="login-container">
            <form id="login-form">

                <label for="username">Логин</label>
                <input
                    type="text"
                    id="username"
                    placeholder="Введите логин"
                    autocomplete="username"
                    required
                >

                <label for="password">Пароль</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Введите пароль"
                    autocomplete="current-password"
                    required
                >

                <div class="login-options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        Запомнить меня
                    </label>
                    <span class="forgot-password">Забыли пароль?</span>
                </div>

                <p id="login-message" class="message" role="alert"></p>

                <button type="submit" id="login-button">Войти</button>

                <p class="register-link">
                    Нет аккаунта?
                    <a href="/register.html">Зарегистрируйтесь!</a>
                </p>

            </form>
        </section>
    </main>
</body>
</html>
